name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          cache: true
      - run: pixi run lint
      # all suites are offline-safe: stub serial bus, ROS_DOMAIN_ID=77
      - run: pixi run test
