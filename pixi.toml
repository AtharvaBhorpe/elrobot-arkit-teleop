[workspace]
name = "elrobot-arkit-teleop"
version = "0.1.0"
description = "ARKit phone teleoperation of the Elrobot arm (ROS 2 Jazzy + lerobot + Pinocchio)"
channels = ["conda-forge", "robostack-jazzy"]
platforms = ["linux-64"]

[dependencies]
# RoboStack ROS 2 Jazzy — ros-base gives rclpy + DDS, no rviz/gazebo (unneeded for the 3 nodes)
# Jazzy targets 3.12 upstream; git lerobot requires >=3.12
python = "3.12.*"
ros-jazzy-ros-base = "*"
# viewer stack for M2: URDF in rviz2 driven by /joint_states
ros-jazzy-rviz2 = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-xacro = "*"
# mcap recording for ros2 bag
ros-jazzy-rosbag2-storage-mcap = "*"
# camera feed viewer (sturdier than rviz Image display for quick checks)
ros-jazzy-rqt-image-view = "*"
# foxglove studio bridge (websocket on :8765) - crash-free alternative GUI
ros-jazzy-foxglove-bridge = "*"
# Kinematics-only Pinocchio for the IK layer (spec: nq=10, meshes not required)
pinocchio = "*"
# build/dev basics
pip = "*"
ruff = "*"
# web cockpit backend
fastapi = "*"
uvicorn = "*"
httpx = "*"          # FastAPI TestClient transport (tests)
# lerobot pins these tighter than conda's defaults — pin conda into the overlap
setuptools = ">=71,<81"
packaging = ">=24.2,<26"
numpy = ">=2.0,<2.3"

[pypi-dependencies]
# Starlette 1.x TestClient runs on the maintained HTTPX2 transport.
httpx2 = "*"
# PyPI lerobot==0.1.0 is a stale placeholder with NO motors/feetech code.
# The maintained bus (FeetechMotorsBus, sync_read/sync_write) lives only on git.
# The `feetech` extra pulls feetech-servo-sdk itself.
lerobot = { git = "https://github.com/huggingface/lerobot.git", extras = ["feetech", "dataset"] }
# this repo itself, importable as `elrobot.*` everywhere (nodes, launches, tests)
elrobot = { path = ".", editable = true }

# ── gates — no hardware needed ─────────────────────────────────────────

[tasks]
# all four stacks import in one process (the M0/M2 prerequisite gate)
prove-env = "python -m elrobot.tools.prove_env"
# every offline suite: stub-bus driver safety, IK self-test, dataset, fake-phone pipeline, web API, calib steps
test = "python tests/test_driver_safety.py && python -m elrobot.control.cartesian_ik && python tests/test_recorder.py && python tests/test_m2_pipeline.py && python tests/test_web_api.py && python tests/test_calib_steps.py && python tests/test_collection.py && python tests/test_export.py"
lint = "ruff check src/ tests/ launch/"

# ── drive the REAL arm ─────────────────────────────────────────────────

# phone teleop, full 7+1 DoF (driver + ik + receiver; regenerates viz URDF first)
m3-arm = "python -m elrobot.tools.make_viz_urdf && ros2 launch launch/m3.launch.py"
# 6+1 DoF, full orientation — joint 3 (a redundant pitch) frozen. NOT joint 5:
# without that roll the Jacobian goes near-singular (sigma_min ~1e-4) and even
# position tracking stalls 37 mm short — 6-DoF control here needs both rolls.
m3-arm6 = "python -m elrobot.tools.make_viz_urdf && FREEZE=rev_motor_03 ros2 launch launch/m3.launch.py"
# SO-101-style 5+1 DoF — joints 3 and 5 frozen at their start pose. Task-priority
# servo: position EXACT, wrist pitch/roll in position's null space, yaw follows
# the arm (5 joints cannot yaw freely).
m3-arm5 = "python -m elrobot.tools.make_viz_urdf && FREEZE=rev_motor_03,rev_motor_05 ros2 launch launch/m3.launch.py"
# slider GUI drives the arm; sliders seed from the arm's current pose
jog = "python -m elrobot.tools.make_viz_urdf && ros2 launch launch/jog.launch.py"
# live tick/angle/load monitor; also RELEASES TORQUE (arm goes limp — support it)
ticks = "python -m elrobot.tools.watch_ticks"
# snapshot / put back the servo EEPROM a recalibration overwrites (+ the
# calibration json that must stay coherent with it). Driver must be stopped.
calib-backup = "python -m elrobot.calibration.backup"
calib-restore = "python -m elrobot.calibration.backup --restore"

# ── visualization only — no hardware ───────────────────────────────────

# web cockpit — browser UI on http://<host>:8080 (LAN only, do not port-forward).
# Regenerates the viz URDF first, same as view/m3-arm/jog: that file is
# gitignored, so without this a fresh clone serves /urdf as a 500 and the
# 3D panel stays empty.
web = "python -m elrobot.tools.make_viz_urdf && python -m elrobot.web.server"
# URDF in rviz2 with joint sliders
view = "python -m elrobot.tools.make_viz_urdf && ros2 launch launch/view.launch.py"
# phone (ZIG SIM PRO -> UDP :50000) drives the model in rviz2
m2 = "python -m elrobot.tools.make_viz_urdf && ros2 launch launch/m2.launch.py"
# foxglove websocket — connect Foxglove Studio to ws://localhost:8765
bridge = "ros2 run foxglove_bridge foxglove_bridge"

# ── cameras & recording ────────────────────────────────────────────────

# wrist + external camera nodes (WRIST_DEV / EXT_DEV env to pick devices)
cams = "ros2 launch launch/cams.launch.py"
# GUI dropdown of /dev/video* with live feed — identify your cameras
campick = "python -m elrobot.tools.cam_picker"
# camera feed viewer (pick topic from its dropdown)
rqt-cam = "env QT_IM_MODULE=compose QT_IM_MODULES= QT_QPA_PLATFORMTHEME= ros2 run rqt_image_view rqt_image_view"
# episode recorder -> LeRobotDataset (own terminal; ENTER starts/stops)
record = "python -m elrobot.nodes.episode_recorder"
# everything -> mcap rosbag under data/bags/ (Ctrl-C to stop)
bag = "ros2 bag record -s mcap -o data/bags/$(date +%Y%m%d_%H%M%S) /joint_states /joint_command /target_pose /gripper_command /wrist_cam/image /ext_cam/image /tf /tf_static"
