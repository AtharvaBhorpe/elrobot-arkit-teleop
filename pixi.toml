[workspace]
name = "elrobot-arkit-teleop"
version = "0.1.0"
description = "ARKit phone teleoperation of the Elrobot arm (ROS 2 Jazzy + lerobot + Pinocchio)"
channels = ["conda-forge", "robostack-jazzy"]
platforms = ["linux-64"]

[dependencies]
# RoboStack ROS 2 Jazzy — ros-base gives rclpy + DDS, no rviz/gazebo (unneeded for the 3 nodes)
# Jazzy targets 3.12 upstream; git lerobot requires >=3.12
python = "3.12.*"
ros-jazzy-ros-base = "*"
# viewer stack for M2: URDF in rviz2 driven by /joint_states
ros-jazzy-rviz2 = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-xacro = "*"
# mcap recording for ros2 bag
ros-jazzy-rosbag2-storage-mcap = "*"
# camera feed viewer (sturdier than rviz Image display for quick checks)
ros-jazzy-rqt-image-view = "*"
# Kinematics-only Pinocchio for the IK layer (spec: nq=10, meshes not required)
pinocchio = "*"
# build/dev basics
pip = "*"
# lerobot pins these tighter than conda's defaults — pin conda into the overlap
setuptools = ">=71,<81"
packaging = ">=24.2,<26"
numpy = ">=2.0,<2.3"

[pypi-dependencies]
# PyPI lerobot==0.1.0 is a stale placeholder with NO motors/feetech code.
# The maintained bus (FeetechMotorsBus, sync_read/sync_write) lives only on git.
# The `feetech` extra pulls feetech-servo-sdk itself.
lerobot = { git = "https://github.com/huggingface/lerobot.git", extras = ["feetech", "dataset"] }

[tasks]
# prove-env: the M0/M2 prerequisite gate — all four stacks import in one process
prove-env = "python scripts/prove_env.py"
# view: URDF in rviz2 with joint sliders (regenerates viz URDF first)
view = "python scripts/make_viz_urdf.py && ros2 launch scripts/view.launch.py"
# m2: phone (ZIG SIM PRO -> UDP :50000) drives the model in rviz2, no hardware
m2 = "python scripts/make_viz_urdf.py && ros2 launch scripts/m2.launch.py"
# m3-arm: phone drives the REAL arm (driver + ik --no-sim-state + receiver)
m3-arm = "python scripts/make_viz_urdf.py && ros2 launch scripts/m3.launch.py"
# jog: sliders drive the REAL arm through the driver; sliders seed from the
# arm's current pose (falls back to zero/neutral if the pre-launch read fails)
jog = "python scripts/make_viz_urdf.py && ros2 launch scripts/jog.launch.py"
# cams: wrist + external camera nodes (WRIST_DEV / EXT_DEV env to pick devices)
cams = "ros2 launch scripts/cams.launch.py"
# campick: GUI dropdown of /dev/video* with live feed - identify your cameras
campick = "python scripts/cam_picker.py"
# record: episode recorder -> LeRobotDataset (own terminal; ENTER starts/stops)
record = "python scripts/episode_recorder.py"
# rqt-cam: camera feed viewer (pick topic from its dropdown)
rqt-cam = "env QT_IM_MODULE=compose QT_IM_MODULES= QT_QPA_PLATFORMTHEME= ros2 run rqt_image_view rqt_image_view"
# bag: everything -> mcap rosbag under data/bags/ (Ctrl-C to stop)
bag = "ros2 bag record -s mcap -o data/bags/$(date +%Y%m%d_%H%M%S) /joint_states /joint_command /target_pose /gripper_command /wrist_cam/image /ext_cam/image /tf /tf_static"
